# Ablation (dissertation Section 4.4.1): normalise real and imaginary parts separately.
model:
  complex_valued: true
  embed_dim: 176
  ff_dim: 704
  num_heads: 8
  num_blocks: 6
  patch_size: 4
  patch_stem: conv
  scoring: linear
  layer_norm: split
  activation: relu

train:
  epochs: 50
  batch_size: 64
  lr: 3.0e-4
  weight_decay: 0.0
  augment: true
